services:
  - type: web
    name: t-pay
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run backend:start
    healthCheckPath: /api/v1/health
    disk:
      name: tpay-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: DATABASE_PATH
        value: /var/data/tpay.db
      - key: PAYPAL_ENV
        value: sandbox
      - key: FX_NGN_PER_USD
        value: "1500"
      - key: FX_SOURCE
        value: demo-fixed-rate
      - key: APP_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
