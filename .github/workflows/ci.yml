name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Refuse PayPal credentials in the client bundle
        run: |
          if grep -rlE "client_secret|api-m\.(sandbox\.)?paypal\.com" dist/assets; then
            echo "The client bundle must not contain PayPal credentials or API endpoints"
            exit 1
          fi
